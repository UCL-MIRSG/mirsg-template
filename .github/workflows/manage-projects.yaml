---
name: Manage issues on the projects board

on:
  issues:
    types:
      - opened

jobs:
  add-issue-to-project:
    permissions: {}
    runs-on: ubuntu-slim
    steps:
      - uses: UCL-MIRSG/.github/actions/add-to-project@e4daf6da08d7b05e7442512fb07ae4c7d9bc1e99 # v0
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PEM: ${{ secrets.APP_PEM }}
        with:
          app-id: ${{ env.APP_ID }}
          app-pem: ${{ env.APP_PEM }}
